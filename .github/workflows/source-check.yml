# Weekly check that the upstream sources still answer and that the NSE feed still speaks the vocabulary
# data/seeds/security_types.csv records. It takes no snapshot and commits nothing.
#
# The run fails, and GitHub mails the repo owner, when a source that is expected to work stops answering or
# when the feed returns an unclassified security type. Sources already known to be down are reported without
# failing, so a long outage does not make the weekly mail routine to ignore.
#
# Two things worth knowing:
#   - NSE sometimes refuses datacentre IPs, so run this once with "Run workflow" before trusting the
#     schedule; if GitHub's runners are blocked, the probes will report a 401 or 403 rather than a change.
#   - GitHub disables a scheduled workflow after 60 days without repository activity.
name: Source check

on:
  schedule:
    - cron: '0 3 * * 1'   # Mondays, 03:00 UTC (08:30 IST)
  workflow_dispatch:

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check sources
        run: python scripts/check_sources.py
